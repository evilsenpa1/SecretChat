
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-chat-backend:dev
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secret-chat-frontend:dev

    ports:
      - "5173:5173"

    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  db:
    image: postgres:18.4-trixie
    ports:
      - "5433:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql


[project]
name = "secretchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "evilsenpa1", email = "alexcorporationo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "asyncpg==0.31.0",
    "authx>=1.7.1",
    "bcrypt>=5.0.0",
    "cffi==2.1.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "linkify-it-py==2.1.0",
    "mako==1.4.1",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdit-py-plugins==0.6.1",
    "mdurl==0.1.2",
    "platformdirs==4.11.3",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.15.0",
    "pygments==2.20.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "textual==8.2.8",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uc-micro-py==2.0.0",
    "uvicorn==0.52.3",
    "watchfiles==1.2.0",
    "websockets==17.0.1",
]

[project.scripts]
secretchat = "secretchat:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ruff==0.15.13",
]
